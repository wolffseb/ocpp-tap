name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: make ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.2
          install-only: true

      - name: make ci
        run: make ci

  e2e:
    name: make e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The pinned headless-csms build lives in .cache/; the Makefile holds
      # the SHA, so a new pin invalidates the cache.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: harness-deps-${{ hashFiles('Makefile') }}

      - name: make e2e
        run: make e2e
